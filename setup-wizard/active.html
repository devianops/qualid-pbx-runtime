<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Quali-D PBX &mdash; Active</title>
<link rel="icon" type="image/png" href="Icon.png">
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  :root {
    --bg:        #f4f7fb;
    --panel:     #ffffff;
    --bg2:       #f8fafc;
    --border:    #e2e8f0;
    --accent:    #2fc4b5;
    --accent-dk: #1a8f84;
    --text:      #1a2535;
    --muted:     #64748b;
    --success:   #16a394;
    --fail:      #dc2626;
    --radius:    14px;
    --radius-sm: 9px;
  }

  body {
    background: var(--bg);
    color: var(--text);
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', system-ui, sans-serif;
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 20px;
  }

  .page {
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 24px;
    width: 100%;
    max-width: 420px;
  }

  .logo img {
    height: 260px;
    width: auto;
    display: block;
  }

  .card {
    background: var(--panel);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    width: 100%;
    padding: 36px 36px 32px;
    box-shadow: 0 4px 24px rgba(0,0,0,.07), 0 1px 4px rgba(0,0,0,.04);
    text-align: center;
  }

  .activated-badge {
    display: inline-flex;
    align-items: center;
    gap: 8px;
    background: rgba(22,163,148,.08);
    border: 1px solid rgba(22,163,148,.25);
    border-radius: 20px;
    padding: 5px 14px;
    font-size: 12px;
    color: var(--success);
    font-weight: 700;
    margin-bottom: 24px;
    letter-spacing: .3px;
  }
  .activated-badge::before {
    content: '';
    display: block;
    width: 7px;
    height: 7px;
    border-radius: 50%;
    background: var(--success);
    animation: pulse-dot 2s ease infinite;
  }
  @keyframes pulse-dot {
    0%, 100% { opacity: 1; transform: scale(1); }
    50%       { opacity: .5; transform: scale(.75); }
  }

  .done-icon {
    width: 68px;
    height: 68px;
    background: rgba(22,163,148,.1);
    border: 2px solid var(--success);
    border-radius: 50%;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 30px;
    color: var(--success);
    margin: 0 auto 24px;
  }

  h2 {
    font-size: 20px;
    font-weight: 700;
    letter-spacing: -.2px;
    margin-bottom: 6px;
  }

  .subtitle {
    font-size: 13px;
    color: var(--muted);
    margin-bottom: 24px;
    line-height: 1.6;
  }

  .info-box {
    background: var(--bg2);
    border: 1px solid var(--border);
    border-radius: var(--radius-sm);
    padding: 15px 18px;
    font-size: 13px;
    color: var(--muted);
    line-height: 1.8;
    text-align: left;
  }
  .info-box strong { color: var(--text); }

  /* ── Device name ─────────────────────────────────────────── */
  .device-name-block {
    margin-bottom: 20px;
  }
  .device-name-label {
    font-size: 10px;
    font-weight: 700;
    letter-spacing: .8px;
    text-transform: uppercase;
    color: var(--muted);
    margin-bottom: 4px;
  }
  .device-name-display {
    font-size: 16px;
    font-weight: 700;
    color: var(--text);
    max-width: 300px;
    margin: 0 auto;
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
  }
  .device-name-display.unnamed { color: var(--muted); font-weight: 400; font-style: italic; }

  .sync-row {
    display: flex;
    align-items: center;
    gap: 8px;
    font-size: 12px;
    color: var(--success);
    font-weight: 600;
    margin-top: 16px;
    justify-content: center;
  }
  .sync-dot {
    width: 7px;
    height: 7px;
    border-radius: 50%;
    background: var(--success);
    animation: pulse-dot 2s ease infinite;
    flex-shrink: 0;
  }

  /* ── Settings rows ───────────────────────────────────────── */
  .settings-section {
    margin-top: 20px;
    padding-top: 16px;
    border-top: 1px solid var(--border);
  }
  .setting-row {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 16px;
    padding: 6px 0;
  }
  .setting-label { text-align: left; }
  .setting-label span:first-child {
    font-size: 13px;
    font-weight: 600;
    color: var(--text);
    display: block;
  }
  .setting-label small {
    font-size: 11px;
    color: var(--muted);
    display: block;
    margin-top: 1px;
  }

  /* Toggle switch */
  .toggle { position: relative; display: inline-block; width: 38px; height: 22px; flex-shrink: 0; }
  .toggle input { opacity: 0; width: 0; height: 0; }
  .slider {
    position: absolute; inset: 0;
    background: var(--border);
    border-radius: 22px;
    cursor: pointer;
    transition: background .2s;
  }
  .slider::before {
    content: '';
    position: absolute;
    width: 16px; height: 16px;
    left: 3px; top: 3px;
    background: #fff;
    border-radius: 50%;
    transition: transform .2s;
    box-shadow: 0 1px 3px rgba(0,0,0,.2);
  }
  .toggle input:checked + .slider { background: var(--accent); }
  .toggle input:checked + .slider::before { transform: translateX(16px); }
  .toggle input:disabled + .slider { opacity: .5; cursor: default; }

  /* ── Update section ──────────────────────────────────────── */
  .update-section {
    margin-top: 20px;
    padding-top: 16px;
    border-top: 1px solid var(--border);
  }
  .update-row {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 10px;
    font-size: 12px;
    min-height: 28px;
  }
  .upd-badge {
    display: inline-flex;
    align-items: center;
    gap: 5px;
    background: rgba(217,119,6,.08);
    border: 1px solid rgba(217,119,6,.25);
    border-radius: 20px;
    padding: 3px 10px;
    font-size: 11px;
    color: #d97706;
    font-weight: 600;
  }
  .btn-upd {
    display: inline-flex;
    align-items: center;
    gap: 5px;
    background: var(--accent);
    color: #fff;
    border: none;
    border-radius: 7px;
    padding: 6px 14px;
    font-size: 12px;
    font-weight: 600;
    cursor: pointer;
    transition: background .15s;
    flex-shrink: 0;
  }
  .btn-upd:hover { background: var(--accent-dk); }
  .btn-upd:disabled { opacity: .5; cursor: default; }
  .upd-spinner {
    width: 13px; height: 13px;
    border: 2px solid var(--border);
    border-top-color: var(--accent);
    border-radius: 50%;
    animation: spin .7s linear infinite;
    flex-shrink: 0;
  }
  @keyframes spin { to { transform: rotate(360deg); } }
  .upd-log {
    margin-top: 10px;
    background: #1a2535;
    border-radius: 8px;
    padding: 10px 12px;
    font-size: 11px;
    font-family: 'SFMono-Regular', Consolas, monospace;
    color: #94a3b8;
    max-height: 110px;
    overflow-y: auto;
    text-align: left;
    white-space: pre-wrap;
    word-break: break-all;
  }
</style>
</head>
<body>
<div class="page">

  <div class="logo">
    <img src="QualiD_PBX_Logo.png" alt="Quali-D PBX" onerror="this.style.display='none'">
  </div>

  <div class="card">
    <div class="activated-badge">Active</div>
    <div class="done-icon">&#10003;</div>
    <h2>Quali-D PBX is Active</h2>

    <!-- Device name — read-only, managed from the Quali-D dashboard -->
    <div class="device-name-block">
      <div class="device-name-label">PBX Device Name</div>
      <div id="dn-display" class="device-name-display unnamed">—</div>
    </div>

    <p class="subtitle">This PBX is connected to the Quali-D cloud and syncing automatically.</p>

    <div class="sync-row">
      <span class="sync-dot"></span>
      Syncing with cloud every minute
    </div>

    <div style="margin-top:20px;text-align:center">
      <a href="diagnose.html" style="
        display:inline-flex;align-items:center;gap:6px;
        font-size:12px;font-weight:600;color:var(--muted);
        text-decoration:none;
        border:1px solid var(--border);border-radius:8px;
        padding:7px 16px;
        transition:border-color .15s,color .15s;
      " onmouseover="this.style.borderColor='var(--accent)';this.style.color='var(--accent)'"
         onmouseout="this.style.borderColor='var(--border)';this.style.color='var(--muted)'">
        &#9881; Diagnostics
      </a>
    </div>

    <!-- Settings section -->
    <div class="settings-section">
      <div class="setting-row">
        <div class="setting-label">
          <span>Call Recording</span>
          <small>Record inbound calls and store to cloud</small>
        </div>
        <label class="toggle" title="Toggle call recording">
          <input type="checkbox" id="rec-toggle" disabled onchange="setRecording(this.checked)">
          <span class="slider"></span>
        </label>
      </div>
    </div>

    <!-- Update section — populated by JS on load -->
    <div class="update-section" id="upd-section" style="display:none">
      <div class="update-row" id="upd-row">
        <span style="color:var(--muted)">Checking for updates&hellip;</span>
      </div>
      <div class="upd-log" id="upd-log" style="display:none"></div>
    </div>
  </div>

</div>

<script>
let _pollTimer = null;

// ── device name (read-only — managed from the Quali-D dashboard) ──────────────
async function loadDeviceName() {
  try {
    var r = await fetch('api.php?action=get_device_info');
    var d = await r.json();
    if (d.success) {
      var name        = d.display_name || '';
      var defaultName = d.company_name ? d.company_name + ' PBX' : '';
      renderDeviceName(name, defaultName);
    }
  } catch(e) {}
}

function renderDeviceName(name, defaultName) {
  var display = document.getElementById('dn-display');
  if (name) {
    display.textContent = name;
    display.classList.remove('unnamed');
  } else {
    // Show "Acme PBX" (from company name) or a plain dash as placeholder.
    // .unnamed style (muted italic) signals no name has been set yet.
    display.textContent = defaultName || '—';
    display.classList.add('unnamed');
  }
}

// ── helpers ───────────────────────────────────────────────────
function setUpdRow(html) {
  document.getElementById('upd-row').innerHTML = html;
}
function showSection() {
  document.getElementById('upd-section').style.display = '';
}

// ── states ────────────────────────────────────────────────────
function showChecking() {
  showSection();
  setUpdRow('<span style="color:var(--muted)">Checking for updates&hellip;</span>');
}
function showUpToDate(ver) {
  showSection();
  setUpdRow(
    '<span style="font-size:12px;color:var(--muted)">Version <strong style="color:var(--text)">v' + esc(ver) + '</strong></span>' +
    '<span style="font-size:11px;color:var(--success);font-weight:600">&#10003;&nbsp;Up&nbsp;to&nbsp;date</span>'
  );
}
function showAvailable(cur, next) {
  showSection();
  setUpdRow(
    '<div style="display:flex;align-items:center;gap:6px;font-size:12px">' +
      '<span style="color:var(--muted)">v' + esc(cur) + '</span>' +
      '<span style="color:var(--muted)">&#8594;</span>' +
      '<span class="upd-badge">v' + esc(next) + ' available</span>' +
    '</div>' +
    '<button class="btn-upd" onclick="doUpdate(\'' + esc(next) + '\')">&#8593; Update</button>'
  );
}
function showUpdating(next) {
  setUpdRow(
    '<span style="display:flex;align-items:center;gap:8px;font-size:12px;color:var(--muted)">' +
      '<span class="upd-spinner"></span>Updating to v' + esc(next) + '&hellip;</span>'
  );
}
function showDone(ver) {
  setUpdRow('<span style="color:var(--success);font-size:12px;font-weight:600">&#10003; Updated to v' + esc(ver) + ' &mdash; reloading&hellip;</span>');
  setTimeout(function(){ location.reload(); }, 3000);
}
function showFailed() {
  setUpdRow('<span style="color:var(--fail);font-size:12px;font-weight:600">&#10005; Update failed &mdash; see log below</span>');
}

// ── update flow ───────────────────────────────────────────────
async function doUpdate(next) {
  showSection();
  showUpdating(next);
  var log = document.getElementById('upd-log');
  log.style.display = '';
  log.textContent   = 'Starting updater\u2026\n';

  try { await fetch('api.php?action=run_update', {method:'POST'}); } catch(e){}

  if (_pollTimer) clearInterval(_pollTimer);
  _pollTimer = setInterval(pollUpdate, 2500);
}

async function pollUpdate() {
  try {
    var r = await fetch('api.php?action=update_status');
    var d = await r.json();
    if (!d.success) return;

    var log = document.getElementById('upd-log');
    if (d.log && d.log.length) {
      log.style.display = '';
      log.textContent   = d.log.join('\n');
      log.scrollTop     = log.scrollHeight;
    }

    if (d.running) return; // still running (or in 15 s grace period)

    clearInterval(_pollTimer); _pollTimer = null;

    if (d.failed)     { showFailed(); return; }
    if (d.done)       { showDone(d.version); return; }
    // neither — no update was in flight; fall back to a fresh check
    checkUpdate();
  } catch(e){}
}

// ── check for available update ────────────────────────────────
async function checkUpdate() {
  showChecking();
  try {
    var r = await fetch('api.php?action=check_update');
    var d = await r.json();
    if (!d.success) { showSection(); setUpdRow('<span style="color:var(--muted);font-size:12px">Could not check for updates</span>'); return; }
    if (d.offline)  { showSection(); setUpdRow('<span style="color:var(--muted);font-size:12px">Offline &mdash; cannot check for updates</span>'); return; }
    if (d.has_update) { showAvailable(d.installed, d.latest); return; }
    showUpToDate(d.installed || 'unknown');
  } catch(e) {
    showSection();
    setUpdRow('<span style="color:var(--muted);font-size:12px">Could not check for updates</span>');
  }
}

// ── escape helper ─────────────────────────────────────────────
function esc(s) {
  return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;').replace(/'/g,'&#39;');
}

// ── call recording toggle ─────────────────────────────────────
async function loadRecordingSettings() {
  try {
    var r = await fetch('api.php?action=get_recording_settings');
    var d = await r.json();
    var chk = document.getElementById('rec-toggle');
    if (d.success) {
      chk.checked  = !!d.record_calls;
      chk.disabled = false;
    }
  } catch(e) {}
}

async function setRecording(enabled) {
  var chk = document.getElementById('rec-toggle');
  chk.disabled = true;
  try {
    var fd = new FormData();
    fd.append('enabled', enabled ? '1' : '0');
    var r = await fetch('api.php?action=set_recording', { method: 'POST', body: fd });
    var d = await r.json();
    if (d.success) {
      chk.checked = !!d.record_calls;
    } else {
      // Revert on failure
      chk.checked = !enabled;
    }
  } catch(e) {
    chk.checked = !enabled;
  } finally {
    chk.disabled = false;
  }
}

// ── on load: load device name + check if an update is in progress ──
(async function init() {
  loadDeviceName();
  loadRecordingSettings();
  try {
    var r = await fetch('api.php?action=update_status');
    var d = await r.json();
    if (d.success && d.running) {
      showSection();
      setUpdRow('<span style="display:flex;align-items:center;gap:8px;font-size:12px;color:var(--muted)"><span class="upd-spinner"></span>Update in progress&hellip;</span>');
      var log = document.getElementById('upd-log');
      if (d.log && d.log.length) { log.style.display=''; log.textContent=d.log.join('\n'); }
      _pollTimer = setInterval(pollUpdate, 2500);
      return;
    }
  } catch(e){}
  checkUpdate();
})();
</script>
</body>
</html>
