# Quali-D PBX OS — Post-activation static page
# Replaces qualid-wizard after first successful activation.
# Served at http://<device-ip>/ — tells the user the PBX is running.

server {
    listen 80 default_server;
    listen [::]:80 default_server;

    server_name _;

    root /usr/share/qualid/setup-wizard;
    index active.html;

    location / {
        try_files $uri $uri/ /active.html;
    }

    location ~ \.php$ {
        fastcgi_pass unix:/run/php/php-fpm-qualid.sock;
        fastcgi_index index.php;
        include fastcgi_params;
        fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
    }

    location ~* \.(png|jpg|gif|ico|svg)$ {
        expires 1d;
        add_header Cache-Control "public";
    }
}
