# Quali-D PBX OS — Setup Wizard (pre-activation)
# Installed at: /etc/nginx/sites-available/qualid-wizard
# Enabled via:  ln -s /etc/nginx/sites-available/qualid-wizard /etc/nginx/sites-enabled/
# Disabled by install.sh after activation (symlink replaced with qualid-active.conf)

server {
    listen 80 default_server;
    listen [::]:80 default_server;

    server_name _;

    root /usr/share/qualid/setup-wizard;
    index index.html;

    # Deny access to sync scripts — only the wizard UI and api.php are served
    location ~ ^/\.\. {
        deny all;
    }
    location ~* /sync-scripts/ {
        deny all;
    }

    # Wizard API
    location = /api.php {
        include        fastcgi_params;
        fastcgi_pass   unix:/run/php/php-fpm-qualid.sock;
        fastcgi_param  SCRIPT_FILENAME $document_root$fastcgi_script_name;
        # Only allow local LAN — reject anything routed from internet
        # (router should not forward port 80, but defence in depth)
        allow  10.0.0.0/8;
        allow  172.16.0.0/12;
        allow  192.168.0.0/16;
        allow  127.0.0.0/8;
        deny   all;
    }

    # Logo image (served without LAN restriction — not sensitive)
    location ~* \.(png|jpg|gif|ico|svg)$ {
        expires 1d;
        add_header Cache-Control "public";
    }

    # Wizard UI
    location / {
        try_files $uri $uri/ /index.html;
        # Same LAN restriction
        allow  10.0.0.0/8;
        allow  172.16.0.0/12;
        allow  192.168.0.0/16;
        allow  127.0.0.0/8;
        deny   all;
    }
}
